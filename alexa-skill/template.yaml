AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Somfy TaHoma - Alexa Smart Home Skill (multi-site)

Parameters:
  AlexaSkillId:
    Type: String
    Description: "Alexa Skill ID (amzn1.ask.skill.XXXX)"
  JwtSecret:
    Type: String
    NoEcho: true
    Description: "HS256 signing secret shared between the auth proxy and the skill Lambda (run: openssl rand -hex 32)"

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        JWT_SECRET: !Ref JwtSecret
    Tags:
      project: somfy-alexa-skill

Resources:

  # OAuth2 auth-code proxy — wraps Somfy password grant for Alexa account linking
  AuthProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: somfy-alexa-auth-proxy
      Handler: auth_proxy.handler
      CodeUri: lambda/
      Description: "Alexa account linking: presents Somfy login form, issues JWTs"
      FunctionUrlConfig:
        AuthType: NONE

  # Alexa Smart Home skill Lambda
  SomfyAlexaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: somfy-alexa-skill
      Handler: handler.lambda_handler
      CodeUri: lambda/
      Description: "Handles Alexa Smart Home directives for Somfy TaHoma (multi-site)"

  # Grant Alexa Smart Home permission to invoke the skill Lambda.
  # Paste the FunctionArn output into the Alexa Skill endpoint configuration.
  AlexaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SomfyAlexaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !Ref AlexaSkillId

Outputs:
  AuthProxyUrl:
    Description: "Base URL for Alexa account linking (append /authorize and /token)"
    Value: !GetAtt AuthProxyFunctionUrl.FunctionUrl
  FunctionArn:
    Description: "Lambda ARN to paste into the Alexa Skill endpoint configuration"
    Value: !GetAtt SomfyAlexaFunction.Arn
